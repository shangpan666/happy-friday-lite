<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phronesis - 连接电脑端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        
        .connect-card {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        
        .input-group input {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            color: #333;
            outline: none;
        }
        
        .input-group input::placeholder {
            color: #999;
        }
        
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #fff;
            color: #667eea;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .btn-secondary:active {
            transform: scale(0.98);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            font-size: 12px;
            opacity: 0.7;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }
        
        .divider span {
            padding: 0 12px;
        }
        
        .tips {
            margin-top: 24px;
            font-size: 12px;
            opacity: 0.7;
            line-height: 1.6;
            text-align: center;
        }
        
        .tips a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo">P</div>
    <h1>Phronesis</h1>
    <p class="subtitle">连接电脑端，同步对话与笔记</p>
    
    <div class="connect-card">
        <div class="input-group">
            <label>电脑端地址</label>
            <input type="url" id="serverInput" placeholder="http://192.168.1.100:17918">
        </div>
        
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="scanQR()">
                扫码连接
            </button>
            <button class="btn btn-primary" onclick="connect()">
                连接
            </button>
        </div>
    </div>
    
    <div class="divider"><span>或</span></div>
    
    <p class="tips">
        1. 确保手机和电脑在同一网络<br>
        2. 在电脑端点击手机图标获取地址<br>
        3. 输入地址或扫描二维码即可连接
    </p>

    <script>
        // 检查是否有保存的地址
        const savedUrl = localStorage.getItem('serverUrl');
        if (savedUrl) {
            document.getElementById('serverInput').value = savedUrl;
        }
        
        function scanQR() {
            // 调用 Android 原生扫码
            if (window.Android && window.Android.scanQRCode) {
                window.Android.scanQRCode();
            } else {
                alert('请使用 Android 版本扫描二维码');
            }
        }
        
        function connect() {
            const url = document.getElementById('serverInput').value.trim();
            if (!url) {
                alert('请输入服务器地址');
                return;
            }
            
            // 验证 URL 格式
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('请输入完整的地址，例如: http://192.168.1.100:17918');
                return;
            }
            
            // 保存地址
            localStorage.setItem('serverUrl', url);
            
            // 调用 Android 原生连接
            if (window.Android && window.Android.connectToServer) {
                window.Android.connectToServer(url);
            } else {
                // 浏览器模式，直接跳转
                window.location.href = url + '/#/mobile';
            }
        }
        
        // 监听回车键
        document.getElementById('serverInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                connect();
            }
        });
    </script>
</body>
</html>
