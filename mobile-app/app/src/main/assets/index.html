<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3574f0">
  <title>Phronesis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 顶部应用栏 -->
    <div class="topbar">
      <button class="icon-btn" id="openDrawer">☰</button>
      <span class="brand">Phronesis</span>
      <div class="right">
        <button class="icon-btn" id="newChat" title="新建对话">＋</button>
      </div>
    </div>

    <!-- 对话 -->
    <div class="view" id="chatView">
      <div class="conversation-header">
        <div class="header-center">
          <span class="header-title" id="chatTitle">与 Phronesis 的对话</span>
          <span class="header-time" id="chatTime"></span>
        </div>
        <button class="header-btn" id="saveNote" title="保存为笔记">📑</button>
      </div>
      <div class="chat-empty" id="chatEmpty">
        <div class="empty-title">与 Phronesis 对话</div>
        <div class="empty-hint">在下方输入消息开始</div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
    </div>

    <div class="composer" id="composer">
      <div class="input-wrapper">
        <textarea id="input" class="main-input" rows="1" placeholder="输入消息..."></textarea>
        <div class="input-actions">
          <div class="left">
            <button class="action-btn" id="voiceBtn" title="语音输入">🎤</button>
          </div>
          <div class="right">
            <button class="send-btn" id="sendBtn">↑</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 侧边栏抽屉 -->
    <div class="drawer-mask" id="drawerMask"></div>
    <aside class="app-nav" id="drawer">
      <div class="nav-inner">
        <div class="brand-row"><span class="brand-name">Phronesis</span></div>
        <button class="new-chat-btn" id="drawerNewChat">＋ 新建对话</button>
        <nav class="nav-scroll">
          <div class="nav-group-label">对话</div>
          <div class="nav-item active" data-tab="chat"><span class="nav-ico">💬</span><span>对话</span></div>
          <div class="nav-item" data-tab="note"><span class="nav-ico">📝</span><span>笔记</span></div>
          <div class="nav-item" data-tab="me"><span class="nav-ico">⚙️</span><span>我的</span></div>
        </nav>
        <div class="nav-footer">
          <button class="user-card">
            <span class="user-avatar-wrap">周</span>
            <span class="user-name">周五</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 笔记 -->
    <div class="view" id="noteView" style="display:none">
      <div class="note-toolbar">
        <input id="noteSearch" placeholder="搜索笔记…">
        <button class="btn" id="newNote">＋</button>
        <button class="btn" id="noteScan" title="扫二维码导入">📷</button>
      </div>
      <div class="note-list" id="noteList"></div>
    </div>
    <div class="note-editor" id="noteEditor">
      <div class="ne-head">
        <span class="act" id="noteCancel">取消</span>
        <span class="act" id="noteSave">保存</span>
      </div>
      <input class="title" id="noteTitle" placeholder="标题">
      <textarea class="body" id="noteBody" placeholder="写点什么…"></textarea>
    </div>

    <!-- 我的 -->
    <div class="view" id="meView" style="display:none">
      <div class="settings" id="settings"></div>
      <div class="about">
        <div class="logo">✦</div>
        <div>Phronesis 手机端 v1.0</div>
        <div style="margin-top:6px">独立 AI 助手 · 数据存于本机</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 导入笔记弹窗 -->
    <div class="modal-mask" id="importMask">
      <div class="modal">
        <div class="modal-title">从电脑导入笔记</div>
        <div class="modal-desc">扫描电脑端二维码，或手动输入电脑端地址。</div>
        <input id="importUrl" placeholder="电脑端地址，如 http://192.168.1.10:17918">
        <div class="modal-actions">
          <button class="m-btn ghost" id="importScan">扫码</button>
          <button class="m-btn primary" id="importConfirm">导入</button>
        </div>
        <button class="modal-cancel" id="importCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
