<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3370ff">
  <title>Phronesis 手机端</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 对话 -->
    <div class="topbar" id="chatTop">
      <div class="icon-btn" id="openDrawer">☰</div>
      <h1 id="chatTitle">对话</h1>
      <div class="right">
        <span class="icon-btn" id="newChat">✏️</span>
      </div>
    </div>

    <div class="view" id="chatView">
      <div class="chat-empty" id="chatEmpty">
        <div class="big">💬</div>
        <div>嗨，我是 Phronesis，有什么可以帮你？</div>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
    </div>

    <div class="composer" id="composer">
      <span class="icon" id="voiceBtn">🎤</span>
      <textarea id="input" rows="1" placeholder="发消息给 Phronesis…"></textarea>
      <button class="send" id="sendBtn">↑</button>
    </div>

    <!-- 会话抽屉 -->
    <div class="drawer-mask" id="drawerMask"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <span>历史对话</span>
        <span class="icon-btn" id="closeDrawer">✕</span>
      </div>
      <div class="conv-list" id="convList"></div>
    </div>

    <!-- 笔记 -->
    <div class="topbar" id="noteTop" style="display:none">
      <div class="icon-btn" style="visibility:hidden">☰</div>
      <h1>笔记</h1>
      <div class="right"><span class="icon-btn" id="noteScan">📷</span></div>
    </div>
    <div class="view" id="noteView" style="display:none">
      <div class="note-toolbar">
        <input id="noteSearch" placeholder="搜索笔记…">
        <button class="btn" id="newNote">＋</button>
      </div>
      <div class="note-list" id="noteList"></div>
    </div>
    <div class="note-editor" id="noteEditor">
      <div class="ne-head">
        <span class="act" id="noteCancel">取消</span>
        <span class="act" id="noteSave">保存</span>
      </div>
      <input class="title" id="noteTitle" placeholder="标题">
      <textarea class="body" id="noteBody" placeholder="写点什么…"></textarea>
    </div>

    <!-- 我的 -->
    <div class="topbar" id="meTop" style="display:none">
      <div class="icon-btn" style="visibility:hidden">☰</div>
      <h1>我的</h1>
      <div class="right"></div>
    </div>
    <div class="view" id="meView" style="display:none">
      <div class="settings" id="settings"></div>
      <div class="about">
        <div class="logo">🧠</div>
        <div>Phronesis 手机端 v1.0</div>
        <div style="margin-top:6px">独立 AI 助手 · 数据存于本机</div>
      </div>
    </div>

    <!-- 底部标签 -->
    <div class="tabbar">
      <div class="tab active" data-tab="chat"><span class="emoji">💬</span>对话</div>
      <div class="tab" data-tab="note"><span class="emoji">📝</span>笔记</div>
      <div class="tab" data-tab="me"><span class="emoji">👤</span>我的</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
