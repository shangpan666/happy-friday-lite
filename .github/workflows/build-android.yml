name: Build Android APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main, master]
    paths:
      - 'android-client/**'   # 仅安卓端改动时自动构建

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Install dependencies
        run: flutter pub get

      # 生成 gradle wrapper + local.properties（会覆盖我们提交的 AndroidManifest，下一步再还原）
      - name: Ensure native project
        run: flutter create --platforms=android --project-name android_client --org com.happyfriday .

      # 还原"内网明文 HTTP"配置（INTERNET 权限 + usesCleartextTraffic + network_security_config）
      - name: Restore LAN HTTP manifest config
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml
          git checkout -- android/app/src/main/res/xml/network_security_config.xml

      # flutter create 默认生成的 Kotlin Gradle 插件版本过低(1.7.1)，与依赖的 kotlin-stdlib 1.9.x 不兼容
      - name: Patch Kotlin version
        run: |
          sed -i 's#id "org.jetbrains.kotlin.android" version "[^"]*"#id "org.jetbrains.kotlin.android" version "1.9.24"#' android/settings.gradle android/build.gradle
          sed -i "s#ext.kotlin_version = '[^']*'#ext.kotlin_version = '1.9.24'#" android/settings.gradle android/build.gradle android/app/build.gradle 2>/dev/null || true
          grep -rn "kotlin" android/settings.gradle android/build.gradle || true

      # 关闭 R8 收缩并挂上 keep 规则，避免 io.flutter.embedding.android.FlutterApplication
      # 被误删导致启动 ClassNotFoundException 闪退（release 构建默认会跑 R8 混淆）
      - name: Disable R8 minify
        run: |
          sed -i '/release {/a\            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"' android/app/build.gradle
          grep -n "minifyEnabled\|proguardFiles" android/app/build.gradle || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-client/build/app/outputs/flutter-apk/app-release.apk
