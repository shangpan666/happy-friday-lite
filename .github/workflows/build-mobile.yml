name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./mobile-app/gradlew

      - name: Build Debug APK
        working-directory: ./mobile-app
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: ./mobile-app
        run: ./gradlew assembleRelease
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Phronesis-Mobile-debug
          path: ./mobile-app/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Phronesis-Mobile-release
          path: ./mobile-app/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./mobile-app/app/build/outputs/apk/debug/*.apk
            ./mobile-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
